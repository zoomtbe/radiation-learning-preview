<body>
<a class="skip" href="#main">Skip to lesson</a>
<div id="app" class="app" data-view="home">

  <header class="topbar">
    <a class="brand" href="#home" data-action="home" aria-label="Radiation / In Context — course overview">
      <span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Radiation <i>/</i> In Context</span>
    </a>
    <div class="lesson-head" aria-live="off">
      <span class="lh-kicker" id="lhKicker"></span>
      <span class="lh-title" id="lhTitle"></span>
    </div>
    <nav class="chapters" id="chapters" aria-label="Lesson chapters"></nav>
    <div class="tools" role="toolbar" aria-label="Lesson tools">
      <button type="button" class="tool" data-drawer="map" aria-haspopup="dialog" aria-label="Course map" title="Course map"><span aria-hidden="true">◎</span><span class="tl">Course map</span></button>
      <button type="button" class="tool" data-drawer="transcript" aria-haspopup="dialog" aria-label="Transcript" title="Transcript"><span aria-hidden="true">≡</span><span class="tl">Transcript</span></button>
      <button type="button" class="tool" data-drawer="notes" aria-haspopup="dialog" aria-label="Notes" title="Notes"><span aria-hidden="true">✎</span><span class="tl">Notes</span></button>
      <button type="button" class="tool" data-drawer="refs" aria-haspopup="dialog" aria-label="Sources" title="Sources"><span aria-hidden="true">§</span><span class="tl">Sources</span></button>
      <button type="button" class="tool" data-drawer="review" aria-haspopup="dialog" title="Copy a review reference or go to any scene"><span aria-hidden="true">⌖</span><span class="tl">Review</span></button>
      <button type="button" class="tool" data-drawer="settings" aria-haspopup="dialog" aria-label="Settings" title="Settings"><span aria-hidden="true">⚙</span><span class="tl">Settings</span></button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- course overview -->
    <section class="home" id="home" aria-labelledby="homeTitle"></section>

    <!-- lesson player -->
    <section class="player" id="player" aria-label="Lesson player" hidden>
      <div class="stagewrap">
        <div class="screen" id="screen">
          <div class="env" id="env" aria-hidden="true"></div>
          <div class="emilia" id="emilia"></div>
          <div class="board" id="board"></div>
          <div class="captions" id="captions" aria-hidden="true"><p id="capText"></p></div>
          <div class="overlay" id="overlay" hidden></div>
        </div>
        <div class="controls" id="controls" role="group" aria-label="Playback controls">
          <button type="button" class="ctl" id="btnPrev" aria-label="Previous paragraph" title="Previous paragraph (Shift+←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button type="button" class="ctl ctl-main" id="btnPlay" aria-label="Play" title="Play / pause (Space or K)"><svg viewBox="0 0 24 24" aria-hidden="true" class="i-play"><path d="M8 5v14l11-7z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" class="i-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
          <button type="button" class="ctl" id="btnNext" aria-label="Next paragraph" title="Next paragraph (Shift+→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
          <button type="button" class="ctl" id="btnReplay" aria-label="Replay this paragraph" title="Replay this paragraph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
          <div class="seek">
            <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position in this section" aria-valuetext="0:00 of 0:00">
            <div class="seek-marks" id="seekMarks" aria-hidden="true"></div>
          </div>
          <span class="time" id="time" aria-hidden="true">0:00 / 0:00</span>
          <label class="rate"><span class="sr-only">Playback speed</span>
            <select id="rate"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option></select>
          </label>
          <button type="button" class="ctl" id="btnMute" aria-label="Mute" aria-pressed="false" title="Mute (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9zM16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9v6h4l5 5V4L8 9z"/></svg></button>
          <input type="range" id="volume" class="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <button type="button" class="ctl ctl-cc" id="btnCC" aria-label="Captions" aria-pressed="true" title="Captions (C)">CC</button>
        </div>
      </div>
      <aside class="dock" id="dock" aria-label="Activity" hidden></aside>
    </section>
  </main>

  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-panel">
      <header><h2 id="drawerTitle"></h2><button type="button" class="close" id="drawerClose" aria-label="Close panel">✕</button></header>
      <div class="drawer-body" id="drawerBody"></div>
    </div>
  </div>
  <div class="sr-only" aria-live="polite" id="announcer"></div>
</div>
<audio id="audio" preload="auto"></audio>
